name: aria2 下载器

# 仅手动触发：在 Actions 页面 Run workflow 时按需填写参数
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "下载目标（直链文件 URL，每行一个；留空则使用 tools/aria2/urls.txt）"
        required: false
        default: ""
      save_name:
        description: "输出文件名（不含扩展名，如 myvideo）；留空按 URL 自动派生（同名已存在则跳过）"
        required: false
        default: ""
      overwrite:
        description: "是否覆盖目标文件：勾选=强制重新下载并删除已存在的同名文件；不勾选=目标文件已存在则跳过不下载"
        required: false
        default: false
        type: boolean
      connections:
        description: "单服务器最大连接数（aria2 协议上限 16）；服务器单连接限速时调大"
        required: false
        default: "16"
      split:
        description: "单文件分片数（-s）"
        required: false
        default: "16"
      min_split_size:
        description: "分片最小尺寸（-k，如 1M / 4M；调大可减少小文件碎片请求）"
        required: false
        default: "1M"
      retries:
        description: "每连接重试次数"
        required: false
        default: "5"
      headers:
        description: '自定义请求头（单行 JSON，如 {"Referer":"https://example.com/"}；本地运行也支持每行 Name: Value）；注意 aria2 不允许设置 Cookie 头，登录态请配 Secret ARIA2_COOKIES'
        required: false
        default: ""
        type: string
      hf_upload:
        description: "下载完成后上传到 Hugging Face datasets（需配 Secret ARIA2_HF_TOKEN）"
        required: false
        default: false
        type: boolean
      hf_repo:
        description: "HF dataset 仓库 ID（用户名/数据集名，如 myuser/my-files）；留空则用 Secret ARIA2_HF_REPO"
        required: false
        default: ""
      hf_path:
        description: "上传到 HF 数据集仓库内的子目录（如 files/2024），留空 = 根路径"
        required: false
        default: ""
      extra_args:
        description: 'aria2c 附加命令行参数（空格分隔，如 --all-proxy http://... --lowest-speed-limit 1M）'
        required: false
        default: ""

# 允许并发：不设 concurrency，多次手动触发各自立即起 runner 排队跑，互不等待。
# runner 之间相互隔离（产物各自本地），互不影响。

permissions:
  contents: read # 只读检出，不向仓库写任何文件

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/aria2/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -U -r tools/aria2/requirements.txt

      # runner 镜像一般已带 aria2，缺失则按需安装（脚本本身也有 PATH >
      # bin/ 缓存 > 静态编译版自动下载的兜底，此步只是优先用发行版）
      - name: 确保 aria2 可用
        run: |
          if ! command -v aria2c >/dev/null 2>&1; then
            echo "未检测到 aria2，正在安装..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq aria2
          fi
          aria2c --version | head -n 1

      # 可选：在仓库 Secrets 配置 ARIA2_COOKIES（cookies.txt 的 base64）后自动启用
      # 注意：secrets 上下文不能直接用于 if 条件（GitHub 会报 Unrecognized named-value），
      # 这里透传进 env，由 shell 判断是否为空
      - name: 写入 cookies（可选）
        env:
          ARIA2_COOKIES_B64: ${{ secrets.ARIA2_COOKIES }}
        run: |
          if [ -n "$ARIA2_COOKIES_B64" ]; then
            printf '%s' "$ARIA2_COOKIES_B64" | base64 -d > cookies.txt
            echo "ARIA2_COOKIES=cookies.txt" >> "$GITHUB_ENV"
            echo "已写入 cookies.txt（来源：secret ARIA2_COOKIES）"
          else
            echo "未配置 secret ARIA2_COOKIES，跳过（无需登录态的下载不受影响）"
          fi

      # GitHub Action 控制 Python 脚本的入口：inputs -> 环境变量 -> 脚本
      # aria2c 二进制由 workflow 上一步或脚本按需自动准备
      # 产物留存：runner 是临时的，文件默认不保留；需要文件就勾选 hf_upload
      # 上传到 HF datasets（或本地运行），不上传 GitHub Artifact
      - name: 运行下载脚本
        env:
          ARIA2_URLS: ${{ github.event.inputs.urls }}
          ARIA2_SAVE_NAME: ${{ github.event.inputs.save_name }}
          ARIA2_OVERWRITE: ${{ github.event.inputs.overwrite }}
          ARIA2_CONNECTIONS: ${{ github.event.inputs.connections }}
          ARIA2_SPLIT: ${{ github.event.inputs.split }}
          ARIA2_MIN_SPLIT_SIZE: ${{ github.event.inputs.min_split_size }}
          ARIA2_MAX_TRIES: ${{ github.event.inputs.retries }}
          ARIA2_HEADERS: ${{ github.event.inputs.headers }}
          ARIA2_EXTRA_ARGS: ${{ github.event.inputs.extra_args }}
          ARIA2_HF_UPLOAD: ${{ github.event.inputs.hf_upload }}
          ARIA2_HF_REPO: ${{ github.event.inputs.hf_repo || secrets.ARIA2_HF_REPO }}
          ARIA2_HF_PATH: ${{ github.event.inputs.hf_path }}
          ARIA2_HF_TOKEN: ${{ secrets.ARIA2_HF_TOKEN }}
        run: python tools/aria2/download.py
