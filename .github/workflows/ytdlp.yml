name: yt-dlp 下载器

# 仅手动触发：在 Actions 页面 Run workflow 时按需填写参数
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "下载目标（视频/播放列表/直链/M3U8 URL，每行一个；留空则使用 tools/ytdlp/urls.txt）"
        required: false
        default: ""
      format:
        description: "格式表达式，如 bv*+ba/b、best[height<=1080]、best"
        required: false
        default: ""
      playlist_end:
        description: "每个播放列表最多下载几个视频，0 = 不限制"
        required: false
        default: "0"
      transcode:
        description: "转码为 MP4：none=不处理 / remux=仅换封装(流拷贝,快) / recode=重编码H.264/AAC(慢,兼容最好)"
        required: false
        default: "none"
        type: choice
        options:
          - "none"
          - "remux"
          - "recode"
      aria2:
        description: "使用 aria2c 多连接加速下载（勾选后自动安装 aria2）"
        required: false
        default: false
        type: boolean

# 同一分支不并发跑，排队执行
concurrency:
  group: ytdlp-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # 回写下载档案

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      YTDLP_ARCHIVE: tools/ytdlp/.ytdlp-archive.txt
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ytdlp/requirements.txt

      - name: 安装依赖（yt-dlp 保持最新）
        run: |
          python -m pip install --upgrade pip
          pip install -U -r tools/ytdlp/requirements.txt
          yt-dlp --version
          ffmpeg -version | head -n 1

      # 勾选 aria2 输入时按需安装（ubuntu-latest 镜像一般已带，缺失才装）
      - name: 安装 aria2（勾选加速时）
        if: ${{ github.event.inputs.aria2 }}
        run: |
          if ! command -v aria2c >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y aria2
          fi
          aria2c --version | head -n 1

      # 可选：在仓库 Secrets 配置 YTDLP_COOKIES（cookies.txt 的 base64）后自动启用
      # 注意：secrets 上下文不能直接用于 if 条件（GitHub 会报 Unrecognized named-value），
      # 这里透传进 env，由 shell 判断是否为空
      - name: 写入 cookies（可选）
        env:
          YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES }}
        run: |
          if [ -n "$YTDLP_COOKIES_B64" ]; then
            printf '%s' "$YTDLP_COOKIES_B64" | base64 -d > cookies.txt
            echo "YTDLP_COOKIES=cookies.txt" >> "$GITHUB_ENV"
            echo "已写入 cookies.txt（来源：secret YTDLP_COOKIES）"
          else
            echo "未配置 secret YTDLP_COOKIES，跳过（无需登录态的下载不受影响）"
          fi

      # GitHub Action 控制 Python 脚本的入口：inputs -> 环境变量 -> 脚本
      - name: 运行下载脚本
        env:
          YTDLP_URLS: ${{ github.event.inputs.urls }}
          YTDLP_FORMAT: ${{ github.event.inputs.format }}
          YTDLP_PLAYLIST_END: ${{ github.event.inputs.playlist_end }}
          YTDLP_TRANSCODE: ${{ github.event.inputs.transcode }}
          YTDLP_ARIA2: ${{ github.event.inputs.aria2 }}
        run: python tools/ytdlp/download.py

      - name: 上传下载产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ytdlp-downloads
          path: tools/ytdlp/downloads/
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0

      # 把下载档案提交回仓库，后续手动运行据此跳过已下载内容
      - name: 回写下载档案
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ytdlp/.ytdlp-archive.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(ytdlp): 更新下载档案 [skip ci]"
            git push
          fi
